<div class="page">

  <h1>🏭 {{ t('supplierManagement') }}</h1>

  <div class="form">

    <input
      [(ngModel)]="name"
      [placeholder]="t('supplierName')"
    >

    <input
      [(ngModel)]="phone"
      [placeholder]="t('phone')"
    >

    <input
      [(ngModel)]="address"
      [placeholder]="t('address')"
    >

    <button (click)="saveSupplier()">
  {{ editingId ? t('updateSupplier') : t('saveSupplier') }}
</button>

  </div>

  <div class="list">
    <p>{{ t('totalSuppliers') }}: {{ suppliers.length }}</p>

    <div
      class="supplier"
      *ngFor="let s of suppliers"
    >

      <h3>{{ s.name }}</h3>

      <p>{{ s.phone }}</p>

      <p>{{ s.address }}</p>

      <p class="due">
  {{ t('due') }}: ৳ {{ s.due || 0 }}
</p>

      <button
  (click)="editSupplier(s)">
  {{ t('edit') }}
</button>

<button
  (click)="deleteSupplier(s.id)">
  {{ t('delete') }}
</button>

    </div>

  </div>

</div>
