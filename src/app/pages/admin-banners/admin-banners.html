<h2>{{ t('bannerCarousel') }}</h2>

<input
  type="file"
  (change)="select($event)">

<button (click)="save()">
  {{ t('uploadBanner') }}
</button>

<hr>

<div
  *ngFor="let b of banners"
  style="margin:20px">

  <img
    [src]="b.imageUrl"
    width="350">

  <br><br>

  <button
    (click)="delete(b.id)">

    {{ t('delete') }}

  </button>

</div>
