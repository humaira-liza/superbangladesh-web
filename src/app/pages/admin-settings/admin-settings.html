<div class="settings-admin-page">

  <div class="page-header">

    <p class="eyebrow">{{ t('siteSettingsEyebrow') }}</p>

    <h2>{{ t('siteLogoTitle') }}</h2>

    <p>
      {{ t('siteLogoDescription') }}
    </p>

  </div>


  <section class="panel">

    <div class="panel-heading">
      <h3>{{ t('currentLogo') }}</h3>
    </div>

    <div class="logo-preview-row">

      <div class="logo-box">

        <img
          *ngIf="settings.logoUrl && !previewUrl"
          [src]="settings.logoUrl"
          alt="Current Logo">

        <span *ngIf="!settings.logoUrl && !previewUrl">
          {{ t('noLogoSet') }}
        </span>

        <img
          *ngIf="previewUrl"
          [src]="previewUrl"
          alt="New Logo Preview">

      </div>

      <div class="upload-controls">

        <label class="file-btn">
          {{ t('chooseImage') }}
          <input
            type="file"
            accept="image/*"
            (change)="onFileChange($event)">
        </label>

        <p class="hint">
          {{ t('squareImageHint') }}
        </p>

        <p class="error" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>

        <button
          type="button"
          class="save-btn"
          [disabled]="saving || !selectedFile"
          (click)="save()">

          {{ saving ? t('uploading') : t('saveLogo') }}

        </button>

      </div>

    </div>

  </section>

</div>
