<div class="profile-page">

  <h2>{{ t('myProfile') }}</h2>

  <div class="profile-card">

    <div class="profile-item">
      <label>{{ t('fullNameLabel') }}</label>

      <input
        type="text"
        [(ngModel)]="fullName"
        [placeholder]="t('enterYourFullName')">
    </div>

    <div class="profile-item">
      <label>{{ t('emailLabel') }}</label>

      <input
        type="email"
        [value]="email"
        readonly>
    </div>

    <div class="profile-item">
      <label>{{ t('phoneLabelForm') }}</label>

      <input
        type="text"
        [(ngModel)]="phone"
        [placeholder]="t('enterPhoneNumberForm')">
    </div>

    <div class="profile-item">
      <label>{{ t('addressLabelForm') }}</label>

      <textarea
        rows="4"
        [(ngModel)]="address"
        [placeholder]="t('enterYourAddress')">
      </textarea>
    </div>

    <button
      class="save-btn"
      (click)="saveProfile()">
      {{ t('saveProfile') }}
    </button>

  </div>

</div>
